[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signaldesk"
version = "0.4.2"
description = "Evidence-first competitive intelligence agents with LangGraph and Deep Agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "01jiyuge"}]
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]>=0.38,<1",
  "langchain[mcp]==1.4.7",
  "langgraph==1.2.16",
  "deepagents==0.7.30",
  "langchain-openai==1.7.2",
  "fastmcp==4.1.3",
  "ag-ui-protocol==1.0.0",
  "langsmith==0.14.12",
  "a2a-sdk[http-server]==1.2.2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]

[project.urls]
Source = "https://github.com/01jiyuge/signaldesk"
Issues = "https://github.com/01jiyuge/signaldesk/issues"
Documentation = "https://github.com/01jiyuge/signaldesk/tree/main/docs"

[project.scripts]
signaldesk = "signaldesk.cli:main"
signaldesk-mcp = "signaldesk.mcp_server:main"
signaldesk-eval = "signaldesk.evaluation_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk"]
exclude = ["**/._*", "**/__pycache__/**"]

[tool.hatch.build.targets.wheel.force-include]
"skills/competitor-analysis/SKILL.md" = "signaldesk/application_skills/competitor-analysis/SKILL.md"
"skills/evidence-review/SKILL.md" = "signaldesk/application_skills/evidence-review/SKILL.md"
"skills/report-writing/SKILL.md" = "signaldesk/application_skills/report-writing/SKILL.md"
"evals/quality_cases.json" = "signaldesk/evaluation_data/quality_cases.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
